openapi: 3.0.0
info: { title: Users API, version: 1.0.0 }
paths:
  /users:
    get:
      operationId: listUsers
      summary: List all users
      tags: [Users]
    post:
      operationId: createUser
      summary: Create a user
      tags: [Users]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                admin: { type: boolean }
  /users/{userId}:
    get:
      operationId: getUser
      summary: Get a user
      tags: [Users]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: integer } }
