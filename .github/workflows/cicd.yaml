name: CI/CD

on:
  pull_request:
    branches:
      - master

# Cancel in-progress runs for the same PR when new commits are pushed.
concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Validate the PR by building the website, exactly as it is built for
  # production. A failing build blocks the PR from being merged.
  build:
    name: Build Website
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.153.3
    steps:

      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Install Dart-Sass
        run: sudo snap install dart-sass

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Assets
        run: make build

      - name: Build with Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: make prod
